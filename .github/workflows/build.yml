name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project archive
        run: unzip -l DonyayeRangMoo-Android-Project-1.zip | head -80
      - name: Extract project
        run: unzip DonyayeRangMoo-Android-Project-1.zip -d extracted
      - name: Show project files
        run: find extracted -maxdepth 3 -type f | head -100
